plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.monetka.app'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.monetka.app'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            def path = System.getenv('MONETKA_KEYSTORE')
            if (path) {
                storeFile file(path)
                storePassword System.getenv('MONETKA_STORE_PASSWORD')
                keyAlias System.getenv('MONETKA_KEY_ALIAS')
                keyPassword System.getenv('MONETKA_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('MONETKA_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
